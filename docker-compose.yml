name: sharelab

# Shared by the FPM service and the standalone (nginx + FPM) service so the two
# deployment shapes cannot drift apart.
x-api-environment: &api-environment
  APP_NAME: ShareLab
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:?set APP_KEY in .env}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: '3306'
  DB_DATABASE: ${DB_DATABASE:-sharelab}
  DB_USERNAME: ${DB_USERNAME:-sharelab}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  SESSION_DRIVER: cookie
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-10080}
  JWT_ACCESS_COOKIE: sharelab_access
  JWT_REFRESH_COOKIE: sharelab_refresh
  JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-lax}
  JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_URL:-http://localhost:8080}}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
  SEED_DATABASE: ${SEED_DATABASE:-0}

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-sharelab}
      MARIADB_USER: ${DB_USERNAME:-sharelab}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # PHP-FPM only; the `web` service below serves the SPA and proxies /api here.
  api:
    build:
      context: ./sharelab-api/backend
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - api-storage:/var/www/html/storage/app

  # nginx + PHP-FPM in one container: the API on its own port, no SPA and no
  # sidecar proxy. This is the image shape to deploy on a Docker PaaS that only
  # routes HTTP traffic to a single container.
  api-http:
    build:
      context: ./sharelab-api/backend
      target: standalone
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-environment
      PORT: ${PORT:-8080}
    volumes:
      - api-storage:/var/www/html/storage/app
    ports:
      - '${API_HTTP_PORT:-8001}:${PORT:-8080}'

  web:
    build:
      context: ./sharelab
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    # Read-only view of the uploads volume so /storage/... is served by nginx.
    volumes:
      - api-storage:/var/www/html/storage/app:ro
    ports:
      - '${APP_PORT:-8080}:80'

volumes:
  db-data:
  api-storage:
