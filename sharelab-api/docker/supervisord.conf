; supervisord keeps the two processes of this container alive.
; It runs as the unprivileged user, so no unix socket, logfile or pid file
; outside /tmp is used; both programs write to the container streams.

[supervisord]
nodaemon = true
; The programs below log to the container streams themselves; supervisord must
; not add a second copy of the same lines.
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
childlogdir = /tmp

[program:php-fpm]
command=php-fpm -F
priority=10
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; nginx -t validation happens once in the entrypoint, not on every restart.
; -e is needed because the compiled-in default error log path is not writable
; by the unprivileged user.
command=nginx -c /tmp/nginx.conf -e /tmp/nginx-error.log -g "daemon off;"
priority=20
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
