; PHP-FPM pool for the API container.
; The master process runs as the unprivileged `sharelab` user, so no `user`
; or `group` directive is set (FPM ignores them, and warns, when not root).

[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; The entrypoint exports the environment, so the pool must not clear it.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
