name: sharelab-prod

# Production stack for a single VPS: API container, Laravel scheduler and
# MariaDB, all with persistent volumes and restart policies.
#
#   cp sharelab-api/.env.example .env.production   # fill every blank
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Put HTTPS (Caddy, nginx, or the host's load balancer) in front of port 8080
# and forward X-Forwarded-Proto; the API trusts forwarded headers.
#
# On a container PaaS with managed MySQL/MariaDB, deploy only the `api` service
# (or a single container from sharelab-api/) and set DB_HOST to the managed
# host. See DEPLOYMENT.md.

x-api-environment: &api-environment
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: ${APP_URL:?set APP_URL (https://api.example.com)}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  LOG_CHANNEL: stderr
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-sharelab}
  DB_USERNAME: ${DB_USERNAME:-sharelab}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_TTL: ${JWT_TTL:-15}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-10080}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS (the SPA origin)}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  PUBLIC_FILESYSTEM_DISK: ${PUBLIC_FILESYSTEM_DISK:-public}
  MAX_UPLOAD_KB: ${MAX_UPLOAD_KB:-4096}
  CACHE_STORE: file
  SESSION_DRIVER: cookie
  QUEUE_CONNECTION: sync

services:
  api:
    build:
      context: ./sharelab-api
    image: sharelab-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: '1'
      SEED_DEMO: '0'
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api-storage:/var/www/html/storage/app
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Waitlist-offer expiry, reminders and overdue notices are scheduled in
  # routes/console.php; without this container they never run.
  scheduler:
    build:
      context: ./sharelab-api
    image: sharelab-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: '0'
      SEED_DEMO: '0'
    command: ['php', 'artisan', 'schedule:work']
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - api-storage:/var/www/html/storage/app

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-sharelab}
      MARIADB_USER: ${DB_USERNAME:-sharelab}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  db-data:
  api-storage:
