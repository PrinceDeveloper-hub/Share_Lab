server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Credential uploads are capped at 5 MB by the API; leave headroom for
    # multipart overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable, content-hashed build output.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public-disk uploads (resource images). The API writes them into the shared
    # api-storage volume, so nginx serves them directly instead of round-tripping
    # through PHP. Response URLs are absolute (<APP_URL>/storage/...).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1h;
    }

    # Laravel API on the PHP-FPM service.
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_pass api:9000;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass api:9000;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
