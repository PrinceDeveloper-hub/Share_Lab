; Runtime PHP settings for the API container.
; The upload ceiling matches MAX_UPLOAD_KB (4 MB) plus multipart overhead, and
; stays below the body limit of hosted proxies so the application, not the
; proxy, produces the validation error.
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 10
max_execution_time = 60

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
