name: sharelab

# Local development stack: the API container (nginx + PHP-FPM on port 8080)
# plus MariaDB. The React SPA is not containerised here — run it with
# `pnpm dev` in sharelab/, where Vite proxies /api to http://localhost:8000.
#
#   cp .env.example .env   # fill APP_KEY, JWT_SECRET, DB_PASSWORD
#   docker compose up -d --build
#   curl http://localhost:8000/api/health
#
# Production has its own file: docker-compose.prod.yml.

services:
  api:
    build:
      context: ./sharelab-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
    ports:
      - '${API_PORT:-8000}:8080'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploads (credentials, condition photos, resource images) survive
      # `docker compose down` and container rebuilds.
      - api-storage:/var/www/html/storage/app

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-sharelab}
      MARIADB_USER: ${DB_USERNAME:-sharelab}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - '${DB_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional: `docker compose --profile tools up -d` then http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-sharelab}
      PMA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - '${PHPMYADMIN_PORT:-8081}:80'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  api-storage:
