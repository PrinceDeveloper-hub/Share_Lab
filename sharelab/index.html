<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ShareLab is a campus resource commons for discovering shared equipment, verifying eligibility, and keeping every booking accountable."
    />
    <meta name="theme-color" content="#4B2F1F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShareLab — Campus Commons</title>
    <script>
      // Resolve the saved theme before first paint so dark mode never flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem('sharelab-theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
